<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드 공책 — 급식 판정기</title>
<style>
:root{
  --종이:#F7F1E3;
  --잉크:#152A4E;
  --흐린잉크:#6B7A8F;
  --노랑:#FFD84D;
  --연두:#BFE3C6;
  --분홍:#C4156B;
  --격자:rgba(21,42,78,.09);
  --뼈대:#152A4E;
  --옷:#C4156B;
  --움직임:#1F7A5A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--종이);
  background-image:
    linear-gradient(var(--격자) 1px, transparent 1px),
    linear-gradient(90deg, var(--격자) 1px, transparent 1px);
  background-size:26px 26px;
  color:var(--잉크);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:15px;
  line-height:1.6;
}
button{font-family:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--분홍);outline-offset:2px}

.머리{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:14px 20px 12px;
  border-bottom:2px solid var(--잉크);
}
.머리 h1{margin:0;font-size:19px;letter-spacing:-.02em}
.머리 .부제{margin:0;color:var(--흐린잉크);font-size:13px}
.머리 .틈{flex:1}
.단추{
  border:2px solid var(--잉크);background:#fff;color:var(--잉크);
  border-radius:9px;padding:6px 12px;font-size:13px;font-weight:600;
}
.단추:hover{background:var(--노랑)}
.단추.주{background:var(--노랑)}
.단추.조용{border-color:var(--흐린잉크);color:var(--흐린잉크);font-weight:500}
.단추.조용:hover{background:#fff;border-color:var(--잉크);color:var(--잉크)}

.판{
  display:grid;
  grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  gap:18px;
  padding:16px 20px;
  height:calc(100vh - 62px);
  min-height:520px;
}
.칸{display:flex;flex-direction:column;min-width:0;min-height:0}

.탭줄{display:flex;gap:6px;align-items:flex-end}
.탭{
  border:2px solid var(--잉크);border-bottom:none;
  background:rgba(255,255,255,.55);
  border-radius:10px 10px 0 0;
  padding:7px 14px 8px;font-size:14px;font-weight:700;
  position:relative;top:2px;color:var(--흐린잉크);
}
.탭 small{display:block;font-size:11px;font-weight:500;letter-spacing:.02em}
.탭[aria-selected="true"]{background:#fff;color:var(--잉크);top:0;padding-bottom:11px}
.탭[data-칸="html"][aria-selected="true"]{box-shadow:inset 0 5px 0 var(--뼈대)}
.탭[data-칸="css"][aria-selected="true"]{box-shadow:inset 0 5px 0 var(--옷)}
.탭[data-칸="js"][aria-selected="true"]{box-shadow:inset 0 5px 0 var(--움직임)}

.편집상자{
  flex:1;min-height:0;display:flex;
  border:2px solid var(--잉크);border-radius:0 12px 12px 12px;
  background:#fff;overflow:hidden;
}
textarea{
  flex:1;width:100%;border:0;resize:none;padding:14px 16px;
  font-family:"D2Coding","Consolas","SFMono-Regular",ui-monospace,monospace;
  font-size:14.5px;line-height:1.75;color:var(--잉크);
  background:transparent;tab-size:2;
}
textarea[hidden]{display:none}

.결과머리{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.결과머리 h2{margin:0;font-size:15px}
.결과머리 .틈{flex:1}
.화면{
  flex:1;min-height:0;
  border:2px solid var(--잉크);border-radius:12px;
  background:#fff;overflow:hidden;
  box-shadow:6px 6px 0 rgba(21,42,78,.14);
}
.화면 iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.알림{
  margin-top:8px;padding:8px 12px;border-radius:9px;font-size:13px;
  border:2px dashed var(--흐린잉크);color:var(--흐린잉크);background:rgba(255,255,255,.6);
}
.알림.문제{border-style:solid;border-color:var(--분홍);color:var(--분홍);background:#fff}

.미션{margin-top:10px}
.미션 h3{margin:0 0 7px;font-size:13px;color:var(--흐린잉크);font-weight:600}
.미션목록{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.미션칩{
  border:2px solid var(--잉크);background:#fff;border-radius:20px;
  padding:5px 12px;font-size:13px;font-weight:600;
}
.미션칩[aria-pressed="true"]{background:var(--노랑)}
.힌트{
  margin-top:8px;padding:10px 13px;background:#fff;
  border:2px solid var(--잉크);border-radius:11px;font-size:13.5px;
}
.힌트 b{color:var(--분홍)}
.힌트 code{
  font-family:"D2Coding","Consolas",ui-monospace,monospace;
  background:var(--연두);padding:1px 5px;border-radius:4px;
}
.힌트[hidden]{display:none}

body.크게 .판{grid-template-columns:1fr}
body.크게 .칸.코드{display:none}

@media (max-width:900px){
  .판{grid-template-columns:1fr;height:auto}
  .칸.코드{height:56vh}
  .칸.결과{height:60vh}
}
@media (prefers-reduced-motion:no-preference){
  .단추,.미션칩{transition:background-color .12s ease}
}
</style>
</head>
<body>

<header class="머리">
  <h1>코드 공책</h1>
  <p class="부제">왼쪽을 고치면 오른쪽이 바뀝니다</p>
  <span class="틈"></span>
  <button class="단추 주" id="실행">실행</button>
  <button class="단추 조용" id="크게보기">결과 크게 보기</button>
  <button class="단추 조용" id="복사">코드 복사</button>
  <button class="단추 조용" id="처음1">1교시 · 급식</button>
  <button class="단추 조용" id="처음3">1교시 · 클릭 게임</button>
  <button class="단추 조용" id="처음2">2교시 · 진짜 급식</button>
</header>

<main class="판">
  <section class="칸 코드">
    <div class="탭줄" role="tablist" aria-label="코드 종류">
      <button class="탭" data-칸="html" role="tab" aria-selected="true">HTML <small>뼈대 · 무엇이 있는가</small></button>
      <button class="탭" data-칸="css" role="tab" aria-selected="false">CSS <small>옷 · 어떻게 보이는가</small></button>
      <button class="탭" data-칸="js" role="tab" aria-selected="false">JS <small>움직임 · 무슨 일이</small></button>
    </div>
    <div class="편집상자">
      <textarea id="코드html" spellcheck="false" aria-label="HTML 코드"></textarea>
      <textarea id="코드css" spellcheck="false" aria-label="CSS 코드" hidden></textarea>
      <textarea id="코드js" spellcheck="false" aria-label="JavaScript 코드" hidden></textarea>
    </div>
  </section>

  <section class="칸 결과">
    <div class="결과머리">
      <h2>결과 화면</h2>
      <span class="틈"></span>
      <label style="font-size:13px;color:var(--흐린잉크)">
        <input type="checkbox" id="자동" checked> 자동으로 실행
      </label>
    </div>
    <div class="화면"><iframe id="미리보기" title="결과 화면"></iframe></div>
    <p class="알림" id="알림">고친 곳이 바로 여기에 나타납니다.</p>

    <div class="미션">
      <h3>오늘의 미션 — 한 번에 한 곳만 바꾸세요</h3>
      <ul class="미션목록" id="미션목록"></ul>
      <div class="힌트" id="힌트" hidden></div>
    </div>
  </section>
</main>

<script>
/* ══════════════════════════════════════════════════════════
   선생님이 미리 바꿔둘 곳 — 게시된 CSV 주소
   시트 구조 :  1행 = 메뉴, 칼로리   /   2행 = 오늘 급식
   ══════════════════════════════════════════════════════════ */
const 급식CSV주소 = "여기에_게시된_CSV_주소를_넣으세요";


/* ── 공통 CSS ─────────────────────────────────────────────── */
const 공통CSS =
`body {
  background: #F7F1E3;
  font-family: sans-serif;
  text-align: center;
  padding: 24px;
}

h1 {
  color: #152A4E;
  font-size: 32px;
}

.설명 {
  color: #6B7A8F;
}

#급식판 {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  justify-content: center;
  margin-top: 24px;
}

.카드 {
  width: 260px;
  padding: 18px;
  border: 3px solid #152A4E;
  border-radius: 16px;
  text-align: left;
}

.날짜 { font-size: 14px; margin: 0 0 10px; }
.메뉴 { font-size: 15px; line-height: 1.7; margin: 0 0 12px; padding-left: 18px; }
.칼로리 { font-size: 30px; font-weight: bold; margin: 0; }
.판정 { font-size: 18px; font-weight: bold; margin: 6px 0 0; }`;


/* ── 1교시 시작 코드 : 데이터가 코드 안에 들어 있음 ─────────── */
const 코드1 = {
html:
`<h1>우리 학교 급식 판정기</h1>
<p class="설명">이번 주 급식을 내 기준으로 판정합니다</p>

<div id="급식판"></div>`,

css: 공통CSS,

js:
`// ★ 내가 정하는 기준
const 기준칼로리 = 800;
const 높을때_문구 = "오늘 급식 든든해요!";
const 낮을때_문구 = "오늘은 가벼워요";

// 급식 데이터 (날짜, 메뉴, 칼로리)
const 급식 = [
  ["9월 1일 월", "기장밥 · 미역국 · 돈가스 · 깍두기", 842],
  ["9월 2일 화", "흑미밥 · 된장국 · 고등어구이 · 나물", 651],
  ["9월 3일 수", "볶음밥 · 계란국 · 만두 · 단무지", 903],
  ["9월 4일 목", "카레라이스 · 유부국 · 샐러드 · 김치", 776],
  ["9월 5일 금", "잔치국수 · 김밥 · 사과 · 김치", 588]
];

let 화면 = "";

급식.forEach(function (한줄) {
  const 날짜 = 한줄[0];
  const 메뉴 = 한줄[1];
  const 칼로리 = 한줄[2];

  const 든든 = 칼로리 >= 기준칼로리;
  const 색 = 든든 ? "#FFD84D" : "#BFE3C6";
  const 문구 = 든든 ? 높을때_문구 : 낮을때_문구;

  화면 += '<div class="카드" style="background:' + 색 + '">'
        + '<p class="날짜">' + 날짜 + '</p>'
        + '<p class="메뉴">' + 메뉴 + '</p>'
        + '<p class="칼로리">' + 칼로리 + ' kcal</p>'
        + '<p class="판정">' + 문구 + '</p>'
        + '</div>';
});

document.getElementById("급식판").innerHTML = 화면;`
};


/* ── 2교시 시작 코드 : 데이터를 인터넷에서 가져옴 ───────────── */
const 코드2 = {
html:
`<h1>우리 학교 급식 판정기</h1>
<p class="설명">오늘 급식을 내 기준으로 판정합니다</p>

<div id="급식판"></div>`,

css: 공통CSS,

js:
`// ★ 바꾸는 곳 1 — 급식 데이터 주소
const 주소 = "` + 급식CSV주소 + `";

// ★ 바꾸는 곳 2 — 내가 정하는 기준
const 기준칼로리 = 800;
const 높을때_문구 = "오늘 급식 든든해요!";
const 낮을때_문구 = "오늘은 가벼워요";

fetch(주소)
  .then(function (답) { return 답.text(); })
  .then(function (글) {

    // 첫 줄은 제목(메뉴, 칼로리)이니까 두 번째 줄을 씁니다
    const 줄들 = 글.replace(/\\r/g, "").trim().split("\\n");
    const 칸 = 줄들[1].split(",");

    const 메뉴 = (칸[0] || "").replace(/"/g, "");
    const 칼로리 = Math.round(Number(칸[1]));

    if (!메뉴 || !칼로리) {
      document.getElementById("급식판").innerHTML =
        '<div class="카드">오늘은 급식이 없어요</div>';
      return;
    }

    const 든든 = 칼로리 >= 기준칼로리;
    const 색 = 든든 ? "#FFD84D" : "#BFE3C6";
    const 문구 = 든든 ? 높을때_문구 : 낮을때_문구;

    // 메뉴를 · 기준으로 잘라서 한 줄씩
    let 메뉴목록 = "";
    메뉴.split("·").forEach(function (하나) {
      메뉴목록 += "<li>" + 하나.trim() + "</li>";
    });

    document.getElementById("급식판").innerHTML =
      '<div class="카드" style="background:' + 색 + '">'
      + '<p class="날짜">오늘의 급식</p>'
      + '<ul class="메뉴">' + 메뉴목록 + '</ul>'
      + '<p class="칼로리">' + 칼로리 + ' kcal</p>'
      + '<p class="판정">' + 문구 + '</p>'
      + '</div>';
  })
  .catch(function () {
    document.getElementById("급식판").innerHTML =
      "<p>데이터를 못 불러왔어요. 주소를 다시 확인해 보세요.</p>";
  });`
};


/* ── 클릭 게임 코드 : 변수와 조건문 맛보기 ─────────────────── */
const 코드3 = {
html:
`<h1>클릭 게임</h1>
<p class="설명">버튼을 눌러 목표까지 올려보세요</p>

<p id="점수판">0</p>
<button id="누르기">눌러!</button>
<p id="말">시작!</p>`,

css:
`body {
  background: #F7F1E3;
  font-family: sans-serif;
  text-align: center;
  padding: 30px;
}

h1 {
  color: #152A4E;
  font-size: 32px;
}

.설명 {
  color: #6B7A8F;
}

#점수판 {
  font-size: 80px;
  font-weight: bold;
  color: #152A4E;
  margin: 20px 0;
}

#누르기 {
  background: #FFD84D;
  color: #152A4E;
  font-size: 24px;
  font-weight: bold;
  padding: 16px 40px;
  border: 3px solid #152A4E;
  border-radius: 40px;
  cursor: pointer;
}

#말 {
  font-size: 22px;
  font-weight: bold;
  margin-top: 20px;
}`,

js:
`// ★ 바꾸는 곳 1 — 한 번 누를 때 올라가는 수
const 증가량 = 1;

// ★ 바꾸는 곳 2 — 목표
const 목표 = 20;

// ★ 바꾸는 곳 3 — 목표에 닿으면 나올 말
const 성공문구 = "해냈다!";

let 점수 = 0;

const 점수판 = document.getElementById("점수판");
const 말 = document.getElementById("말");

document.getElementById("누르기").onclick = function () {

  점수 = 점수 + 증가량;
  점수판.textContent = 점수;

  if (점수 >= 목표) {
    말.textContent = 성공문구;
  } else {
    말.textContent = (목표 - 점수) + "번 더!";
  }

};`
};


/* ── 미션 ─────────────────────────────────────────────────── */
const 미션모음 = {

급식: [
  { 이름:"1. 배경색", 칸:"css", 찾기:"background: #F7F1E3",
    말:"<b>CSS</b>에서 <code>body</code> 안의 <code>background</code> 값을 바꿔 보세요. 화면 전체 색이 바뀝니다. 색 이름을 그냥 <code>pink</code>처럼 영어로 써도 됩니다." },
  { 이름:"2. 제목 크기", 칸:"css", 찾기:"font-size: 32px",
    말:"<b>CSS</b>의 <code>h1</code> 안에서 <code>font-size</code> 숫자를 키워 보세요. 제목만 커지고 카드는 그대로인 것을 확인하세요." },
  { 이름:"3. 모서리", 칸:"css", 찾기:"border-radius: 16px",
    말:"<b>CSS</b>의 <code>.카드</code> 안에서 <code>border-radius</code>를 <code>0px</code>로 바꿔 보세요. 각진 카드가 됩니다. 다시 크게 하면?" },
  { 이름:"4. 제목 글자", 칸:"html", 찾기:"<h1>",
    말:"<b>HTML</b>의 <code>&lt;h1&gt;</code>와 <code>&lt;/h1&gt;</code> 사이 글자를 내가 지은 이름으로 바꿔 보세요." },
  { 이름:"5. 내 기준 ★", 칸:"js", 찾기:"기준칼로리 = 800",
    말:"<b>JS</b>의 <code>기준칼로리</code>를 <code>600</code>으로 바꿔 보세요. 카드 색이 확 바뀝니다. <code>1000</code>으로도 해보고, 마지막에 <b>내가 생각하는 기준</b>을 넣으세요. 문구도 내 말로 바꿔 보세요." },
  { 이름:"도전. 가로 배치", 칸:"css", 찾기:"display: flex",
    말:"<b>CSS</b>의 <code>#급식판</code>에서 <code>display: flex;</code> 줄을 지웠다가 다시 넣어 보세요. 카드가 세로로 쌓였다 가로로 눕습니다." }
],

클릭: [
  { 이름:"1. 버튼 색", 칸:"css", 찾기:"background: #FFD84D",
    말:"<b>CSS</b>의 <code>#누르기</code> 안에서 <code>background</code> 를 바꿔 보세요. 버튼 색만 바뀝니다." },
  { 이름:"2. 숫자 크기", 칸:"css", 찾기:"font-size: 80px",
    말:"<b>CSS</b>의 <code>#점수판</code> 안에서 <code>font-size</code> 를 <code>150px</code> 로 키워 보세요." },
  { 이름:"3. 증가량 ★", 칸:"js", 찾기:"증가량 = 1",

/* ── 동작 ─────────────────────────────────────────────────── */
const 상자 = { html:document.getElementById("코드html"),
               css:document.getElementById("코드css"),
               js:document.getElementById("코드js") };
const 탭들 = [...document.querySelectorAll(".탭")];
const 미리보기 = document.getElementById("미리보기");
const 알림 = document.getElementById("알림");
const 힌트 = document.getElementById("힌트");
const 자동 = document.getElementById("자동");
let 타이머 = null;

function 코드넣기(꾸러미, 미션종류){
  상자.html.value = 꾸러미.html;
  상자.css.value  = 꾸러미.css;
  상자.js.value   = 꾸러미.js;
  미션그리기(미션모음[미션종류] || 미션모음.급식);
  탭바꾸기("html");
  실행하기();
}

function 탭바꾸기(이름){
  탭들.forEach(t => t.setAttribute("aria-selected", t.dataset.칸 === 이름));
  Object.entries(상자).forEach(([k,v]) => v.hidden = (k !== 이름));
  상자[이름].focus({preventScroll:true});
}
탭들.forEach(t => t.addEventListener("click", () => 탭바꾸기(t.dataset.칸)));

function 실행하기(){
  const 감시 = `<script>
    window.onerror = function(m){
      parent.postMessage({종류:"오류", 말:String(m)}, "*");
      return true;
    };
  <\/script>`;
  미리보기.srcdoc =
    '<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">'
    + 감시
    + '<style>' + 상자.css.value + '</style></head><body>'
    + 상자.html.value
    + '<script>try{' + 상자.js.value + '}catch(e){parent.postMessage({종류:"오류",말:String(e.message)},"*")}<\/script>'
    + '</body></html>';
  알림.className = "알림";
  알림.textContent = "실행했습니다. 고친 곳이 화면에 보이나요?";
}

window.addEventListener("message", e => {
  if (e.data && e.data.종류 === "오류"){
    알림.className = "알림 문제";
    알림.textContent = "코드에 문제가 있어요 → " + e.data.말
      + "  (괄호나 따옴표가 빠지지 않았는지 보세요)";
  }
});

Object.values(상자).forEach(t => t.addEventListener("input", () => {
  if (!자동.checked) return;
  clearTimeout(타이머);
  타이머 = setTimeout(실행하기, 700);
}));

document.getElementById("실행").addEventListener("click", 실행하기);
document.getElementById("처음1").addEventListener("click", () => {
  if (confirm("1교시 급식 코드로 되돌립니다. 지금 고친 내용은 사라집니다.")) 코드넣기(코드1, "급식");
});
document.getElementById("처음3").addEventListener("click", () => {
  if (confirm("클릭 게임 코드로 바꿉니다. 지금 고친 내용은 사라집니다.")) 코드넣기(코드3, "클릭");
});
document.getElementById("처음2").addEventListener("click", () => {
  if (confirm("2교시 진짜 급식 코드로 바꿉니다. 지금 고친 내용은 사라집니다.")) 코드넣기(코드2, "급식");
});
document.getElementById("크게보기").addEventListener("click", e => {
  document.body.classList.toggle("크게");
  e.target.textContent = document.body.classList.contains("크게") ? "코드 다시 보기" : "결과 크게 보기";
});
document.getElementById("복사").addEventListener("click", async e => {
  const 전체 = "<!-- HTML -->\n" + 상자.html.value
             + "\n\n/* CSS */\n" + 상자.css.value
             + "\n\n// JS\n" + 상자.js.value;
  try { await navigator.clipboard.writeText(전체); e.target.textContent = "복사했어요"; }
  catch { e.target.textContent = "복사 실패"; }
  setTimeout(() => e.target.textContent = "코드 복사", 1500);
});

const 목록 = document.getElementById("미션목록");

function 미션그리기(미션들){
  목록.innerHTML = "";
  힌트.hidden = true;
  미션들.forEach(m => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "미션칩"; b.textContent = m.이름; b.setAttribute("aria-pressed","false");
    b.addEventListener("click", () => {
      [...목록.querySelectorAll(".미션칩")].forEach(x => x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      힌트.hidden = false;
      힌트.innerHTML = m.말;
      탭바꾸기(m.칸);
      const 위치 = 상자[m.칸].value.indexOf(m.찾기);
      if (위치 > -1){
        상자[m.칸].setSelectionRange(위치, 위치 + m.찾기.length);
        상자[m.칸].blur(); 상자[m.칸].focus();
      }
    });
    li.appendChild(b); 목록.appendChild(li);
  });
}
